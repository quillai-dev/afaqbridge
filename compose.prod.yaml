# Production: publishes 80/443 (set EDGE_BIND_ADDR to a specific IP if the host shares ports with other projects).
# Requires real DNS names in SITE_NAME / DOCUSEAL_HOST. Certificates: `make tls-issue` (docs/deployment.md).
services:
  edge:
    environment:
      EDGE_MODE: prod
    ports:
      - "${EDGE_BIND_ADDR:-0.0.0.0}:${EDGE_PROD_HTTP_PORT:-80}:80"
      - "${EDGE_BIND_ADDR:-0.0.0.0}:${EDGE_PROD_HTTPS_PORT:-443}:443"
    volumes:
      - letsencrypt:/etc/letsencrypt:ro
      - acme-webroot:/var/www/certbot:ro

  # Renews certificates every 12 h (webroot HTTP-01 through `edge`; no docker.sock, no Traefik).
  certbot:
    image: ${CERTBOT_IMAGE:-certbot/certbot:v4.0.0}
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c", "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $$!; done"]
    volumes:
      - letsencrypt:/etc/letsencrypt
      - acme-webroot:/var/www/certbot
    deploy: {resources: {limits: {cpus: "0.25", memory: 128m}}}
